<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrackLab</title>
    <!--==================== Styles imports ====================-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!--==================== Styles own ====================-->
    <link rel="stylesheet" href="./styles/reboot.css" />
    <link rel="stylesheet" href="./styles/init.css" />
    <link rel="stylesheet" href="./styles/layout/login.css" />
    <link rel="stylesheet" href="./styles/layout/info-panel.css" />
    <link rel="stylesheet" href="./styles/components/button.css" />
    <link rel="stylesheet" href="./styles/components/form.css" />
  </head>
  <body>
    <div class="login">
      <section class="login__section">
        <div class="login__logo">
          <img src="./assets/icon.png" alt="icon" />
        </div>
        <h1 class="login__title">INICIAR SESIÓN</h1>
        <div class="login__content">
          <form class="form">
            <div class="form__group">
              <label class="form__label" for="email">Correo gmail</label>
              <input
                id="email"
                type="email"
                class="form__input"
                placeholder="ejemplo@gmail.com"
              />
            </div>
            <div class="form__group">
              <label class="form__label" for="password">Contraseña</label>
              <div class="form__password-wrapper">
                <input
                  id="password"
                  type="password"
                  class="form__input"
                  placeholder="••••••"
                />
                <button type="button" class="form__password-toggle">
                  <i class="far fa-eye"></i>
                </button>
              </div>
            </div>
            <div class="form__checkbox-wrapper">
              <input id="remember" type="checkbox" class="form__checkbox" />
              <label for="remember" class="form__checkbox-label"
                >Recordarme</label
              >
            </div>
            <button
              type="submit"
              class="button button--primary button--full button--upper"
            >
              INGRESAR
            </button>
          </form>

          <div class="login__divider">
            <hr class="login__divider-line" />
            <span class="login__divider-text">o</span>
            <hr class="login__divider-line" />
          </div>

          <button class="social-button">
            <img src="./assets/iconGoogle.png" alt="icon-google" />
            Continuar con Google
          </button>
        </div>
      </section>
      <section class="info-panel">
        <h2 class="info-panel__logo">TrackLab</h2>
        <div class="info-panel__icon">
          <img src="./assets/mapIcon.png" alt="mapIcon" width="150" />
        </div>
        <h2 class="info-panel__title">Presentamos nuestras nuevas funciones</h2>
        <p class="info-panel__text">
          Encuentra rápidamente los mejores docentes, materias y recursos
          educativos. Nuestro sistema de tracking analiza tendencias previas
          para garantizar que siempre tomes la decisión correcta en tu camino
          académico.
        </p>
      </section>
    </div>
  </body>
</html>
